<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">SPI Time Loop architecture</title>
  <desc id="desc">A scheduler controls an SPI master PHY communicating with simulated gas, temperature, and worker-status devices. The selected response is routed back to the PHY and checked by demo alert logic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a35"/>
      <stop offset="1" stop-color="#172c4d"/>
    </linearGradient>
    <linearGradient id="master" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="slave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183c57"/>
      <stop offset="1" stop-color="#1d5260"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c4b5fd"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .label { fill: #dbeafe; font-size: 18px; font-weight: 600; }
      .small { fill: #a9bbd8; font-size: 14px; }
      .box-title { fill: #fff; font-size: 21px; font-weight: 700; }
      .box-sub { fill: #d6e4f5; font-size: 14px; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="80" r="130" fill="#2563eb" opacity=".08"/>
  <circle cx="90" cy="580" r="170" fill="#22d3ee" opacity=".06"/>
  <text x="60" y="62" fill="#fff" font-size="30" font-weight="750">SPI Time Loop</text>
  <text x="60" y="91" fill="#9fb5d5" font-size="16">Mine-rescue monitoring demo · three simulated devices · repeatable polling</text>

  <rect x="70" y="155" width="260" height="105" rx="18" fill="#222f52" stroke="#818cf8" stroke-width="2"/>
  <text x="200" y="198" text-anchor="middle" class="box-title">Scheduler</text>
  <text x="200" y="228" text-anchor="middle" class="box-sub">polls gas → temperature → worker status</text>

  <rect x="70" y="343" width="260" height="154" rx="20" fill="url(#master)" stroke="#93c5fd" stroke-width="2"/>
  <text x="200" y="390" text-anchor="middle" class="box-title">SPI Master PHY</text>
  <text x="200" y="421" text-anchor="middle" class="box-sub">SCLK · MOSI · MISO · CS</text>
  <text x="200" y="454" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">TX 0xA5</text>
  <text x="200" y="477" text-anchor="middle" fill="#dbeafe" font-size="13">CPOL / CPHA modes 0–3</text>

  <path d="M200 260V330" fill="none" stroke="#c4b5fd" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <text x="218" y="302" class="small">start + selection</text>

  <rect x="480" y="151" width="265" height="100" rx="18" fill="url(#slave)" stroke="#67e8f9" stroke-width="2"/>
  <circle cx="518" cy="201" r="19" fill="#22d3ee" opacity=".2" stroke="#67e8f9"/>
  <text x="518" y="207" text-anchor="middle" fill="#a5f3fc" font-size="15" font-weight="700">0</text>
  <text x="615" y="191" text-anchor="middle" class="box-title">Gas Sensor Model</text>
  <text x="615" y="220" text-anchor="middle" class="box-sub">example reading: 0x30</text>

  <rect x="480" y="309" width="265" height="100" rx="18" fill="url(#slave)" stroke="#67e8f9" stroke-width="2"/>
  <circle cx="518" cy="359" r="19" fill="#22d3ee" opacity=".2" stroke="#67e8f9"/>
  <text x="518" y="365" text-anchor="middle" fill="#a5f3fc" font-size="15" font-weight="700">1</text>
  <text x="615" y="349" text-anchor="middle" class="box-title">Temperature Model</text>
  <text x="615" y="378" text-anchor="middle" class="box-sub">example reading: 0x30</text>

  <rect x="480" y="467" width="265" height="100" rx="18" fill="url(#slave)" stroke="#67e8f9" stroke-width="2"/>
  <circle cx="518" cy="517" r="19" fill="#22d3ee" opacity=".2" stroke="#67e8f9"/>
  <text x="518" y="523" text-anchor="middle" fill="#a5f3fc" font-size="15" font-weight="700">2</text>
  <text x="615" y="507" text-anchor="middle" class="box-title">Worker Status Model</text>
  <text x="615" y="536" text-anchor="middle" class="box-sub">example status: 0x01 = OK</text>

  <path d="M330 390H420V201H465" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <path d="M420 359H465" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <path d="M420 517H465" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <text x="385" y="380" transform="rotate(-90 385 380)" text-anchor="middle" class="small">SCLK + MOSI + chip select</text>

  <path d="M745 201H850V330H885" fill="none" stroke="#c4b5fd" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M745 359H885" fill="none" stroke="#c4b5fd" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M745 517H850V388H885" fill="none" stroke="#c4b5fd" stroke-width="3" marker-end="url(#arrow-violet)"/>

  <rect x="900" y="300" width="240" height="118" rx="20" fill="#332a5e" stroke="#c4b5fd" stroke-width="2"/>
  <text x="1020" y="345" text-anchor="middle" class="box-title">MISO + Alert Check</text>
  <text x="1020" y="375" text-anchor="middle" class="box-sub">selected reading returns to PHY</text>
  <text x="1020" y="398" text-anchor="middle" class="box-sub">demo conditions set rescue alert</text>
  <path d="M900 359H835V420H340" fill="none" stroke="#c4b5fd" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <text x="700" y="448" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="600">MISO · selected slave's reply</text>

  <rect x="846" y="510" width="294" height="52" rx="14" fill="#ffffff" opacity=".07"/>
  <text x="993" y="542" text-anchor="middle" fill="#cbd5e1" font-size="14">Educational example only · not a safety system</text>
</svg>
