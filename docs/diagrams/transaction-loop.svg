<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">SPI transaction loop</title>
  <desc id="desc">The scheduler selects a slave, the master sends and receives a byte, checks the transaction result, then advances to the next slave and repeats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8f2ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .title { fill: #0f172a; font-size: 27px; font-weight: 750; }
      .step { fill: #fff; font-size: 18px; font-weight: 700; }
      .desc { fill: #dbeafe; font-size: 14px; }
      .num { fill: #1d4ed8; font-size: 14px; font-weight: 800; }
    </style>
  </defs>
  <rect width="1200" height="390" rx="26" fill="url(#bg)"/>
  <text x="55" y="58" class="title">Mine-rescue demo: poll, read, check, repeat</text>

  <g>
    <rect x="55" y="128" width="220" height="142" rx="20" fill="url(#blue)"/>
    <circle cx="83" cy="155" r="17" fill="#fff" opacity=".18"/>
    <text x="83" y="160" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">1</text>
    <text x="165" y="190" text-anchor="middle" class="step">Select a device</text>
    <text x="165" y="222" text-anchor="middle" class="desc">gas → temperature → worker</text>
    <text x="165" y="245" text-anchor="middle" class="desc">one chip select active</text>

    <rect x="345" y="128" width="220" height="142" rx="20" fill="url(#blue)"/>
    <circle cx="373" cy="155" r="17" fill="#fff" opacity=".18"/>
    <text x="373" y="160" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">2</text>
    <text x="455" y="190" text-anchor="middle" class="step">Send data</text>
    <text x="455" y="222" text-anchor="middle" class="desc">MOSI: 0xA5</text>
    <text x="455" y="245" text-anchor="middle" class="desc">clocked in 8 bits</text>

    <rect x="635" y="128" width="220" height="142" rx="20" fill="url(#blue)"/>
    <circle cx="663" cy="155" r="17" fill="#fff" opacity=".18"/>
    <text x="663" y="160" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">3</text>
    <text x="745" y="190" text-anchor="middle" class="step">Read the sensor</text>
    <text x="745" y="222" text-anchor="middle" class="desc">read the selected device byte</text>
    <text x="745" y="245" text-anchor="middle" class="desc">safe example: 0x30 / 0x30 / 0x01</text>

    <rect x="925" y="128" width="220" height="142" rx="20" fill="#0f766e"/>
    <circle cx="953" cy="155" r="17" fill="#fff" opacity=".18"/>
    <text x="953" y="160" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">4</text>
    <text x="1035" y="190" text-anchor="middle" class="step">Check &amp; alert</text>
    <text x="1035" y="222" text-anchor="middle" class="desc">demo rules check readings</text>
    <text x="1035" y="245" text-anchor="middle" class="desc">testbench checks alert cases</text>
  </g>

  <path d="M280 199H333" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M570 199H623" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M860 199H913" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1035 278V320H165V280" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="475" y="300" width="250" height="38" rx="19" fill="#fff" stroke="#cbd5e1"/>
  <text x="600" y="325" text-anchor="middle" fill="#475569" font-size="14" font-weight="600">illustrative thresholds only · not mine-safety limits</text>
</svg>
